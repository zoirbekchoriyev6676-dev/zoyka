<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tizimga Kirish — Enterprise Test & Imtihon Platformasi</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .login-container {
      max-width: 480px;
      margin: 4rem auto;
      padding: 0 1rem;
    }
    .login-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
    }
    .login-tabs {
      display: flex;
      border-bottom: 2px solid var(--border);
      margin-bottom: 1.5rem;
    }
    .login-tab-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: none;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: var(--transition);
    }
    .login-tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
  </style>
</head>
<body style="background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%); min-height: 100vh;">

  <div class="login-container">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 12px auto; width: 54px; height: 54px; font-size: 1.6rem;">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1 style="font-size: 1.7rem; font-weight: 800; color: #1e1b4b;">Test Platformasi</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Maktab, litsey va oliy ta'lim imtihon portali</p>
    </div>

    <div class="login-card">
      <!-- Rol bo'yicha tablar -->
      <div class="login-tabs">
        <button class="login-tab-btn active" data-tab="student">
          <i class="fa-solid fa-user-graduate"></i> O'quvchi
        </button>
        <button class="login-tab-btn" data-tab="teacher">
          <i class="fa-solid fa-chalkboard-user"></i> O'qituvchi
        </button>
        <button class="login-tab-btn" data-tab="admin">
          <i class="fa-solid fa-shield-halved"></i> Admin
        </button>
      </div>

      <div id="login-error-alert" style="display: none; padding: 10px 14px; background: #fee2e2; color: #991b1b; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem;">
        <i class="fa-solid fa-circle-exclamation"></i> <span id="login-error-text">Xatolik</span>
      </div>

      <form id="login-form">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label id="lbl-identifier" for="input-identifier">
            <i class="fa-regular fa-id-card"></i> O'quvchi Kodi yoki Login:
          </label>
          <input type="text" id="input-identifier" class="form-control" placeholder="Login yoki ID" required>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label id="lbl-secret" for="input-secret">
            <i class="fa-solid fa-lock"></i> PIN Kod yoki Parol:
          </label>
          <input type="password" id="input-secret" class="form-control" placeholder="PIN kod yoki parol" required>
        </div>

        <button type="submit" id="btn-submit-login" class="btn btn-primary btn-block" style="padding: 13px; font-size: 1.05rem;">
          <i class="fa-solid fa-right-to-bracket"></i> Tizimga Kirish
        </button>
      </form>
    </div>
  </div>

  <script src="/static/js/login.js"></script>
</body>
</html>
