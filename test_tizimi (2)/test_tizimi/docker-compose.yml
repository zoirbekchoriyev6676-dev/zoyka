version: '3.8'

services:
  web:
    build: .
    container_name: test_platformasi_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_PATH=database/database.db
    volumes:
      - ./database:/app/database
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build: .
    container_name: test_platformasi_bot
    restart: unless-stopped
    command: ["python", "bot/main.py"]
    volumes:
      - ./database:/app/database
      - ./.env:/app/.env
    depends_on:
      - web
